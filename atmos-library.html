umn for statements; captions hug the viewport edges on a 12-column grid. Each chapter owns exactly one viewport — no half-scrolls.",motion:"Camera framing is driven by scroll progress, never by time. Text enters with a 12px rise and a 40ms stagger, easing out over 500ms.",interaction:"The only hover state that matters is the next-chapter marker: it dilates slightly and previews the chapter title. The cursor becomes a thin crosshair over the stage."},buildPrompt:`Create an original immersive one-page site for {{brand}} — {{industry}} presenting {{product}}.

CONCEPT
A single monumental 3D form staged in fog on a near-black set. The page reads like a film: each scroll chapter rotates or dollies the camera around the form and reveals one statement at a time.

LAYOUT & HIERARCHY
- One viewport per chapter; statements centered in a strict column, captions pinned to the frame edges on a 12-column grid.
- A hairline vertical progress rail lists chapters 01–05; the active mark is filled, the rest sit at 30% opacity.
- Reserve one full-viewport "quiet frame" holding a single sentence — negative space is the luxury here.

VISUAL MOOD
Cinematic and monastic: deep shadows, soft volumetric falloff, faint film grain, zero decorative clutter. The form should feel carved, not rendered — matte surfaces, one cool rim light.

TYPOGRAPHY
A condensed grotesk at poster scale (clamp 3rem–7rem, letter-spacing −0.03em) for statements; 11px uppercase captions with 0.28em tracking for labels; tabular figures for indices.

COLOR
Base #0a0a09, graphite #1c1c1a surfaces, bone #f4f1ea text, and {{accent}} used only for the progress rail, the active chapter mark, and one underline per chapter.

MOTION & INTERACTION
Drive all camera movement from scroll progress — never time-based autoplay. Text enters with a 12px rise and 40ms stagger easing out at 500ms. The next-chapter marker dilates on hover. Animate transform and opacity only to hold 60fps.

RESPONSIVE BEHAVIOR
Below 768px, simplify to a layered 2.5D composition (blurred CSS planes with gentle parallax) so mobile GPUs stay cool; captions stack beneath statements; the progress rail becomes a top hairline.

ACCESSIBILITY
Body copy at 4.5:1 contrast minimum, display at 3:1. The full story must read as plain semantic HTML with the 3D layer aria-hidden. Ship a reduced-motion variant that crossfades chapters without camera moves.

TECHNICAL DIRECTION
React + TypeScript + Tailwind; Framer Motion (useScroll / useTransform) for scroll orchestration and text reveals; reach for Three.js only if the geometry truly needs it — otherwise fake depth with CSS 3D transforms and blurred planes.

ORIGINALITY

collection of {{product}} — with the patience of a printed monograph.

Museum-at-night luxury: warm near-black rooms, one soft key light per object, deep but soft shadows, a faint grain of analog film.

ected edges and dims the rest to 20%."},buildPrompt:`Design an original marketing site for {{brand}} — {{industry}} launching {{product}} — that reads like a beautifully set engineering document.

CONCEPT
A drafting-table aesthetic: blueprint linework, glassy spec panels, and small ambient data motions. The product should feel like precision machinery, not a cartoon dashboard.

LAYOUT & HIERARCHY
- A 12-column spec-sheet grid: headline spans 7 columns, a live diagram spans 5; full-width numbered spec tables below (1.0, 1.1, 1.2).
- Every section opens with a hairline rule, an uppercase kicker, and a one-sentence promise — no paragraph longer than 3 lines above the fold.
- One persistent side rail shows system status as tiny mono text; it is decorative, aria-hidden, and honest-looking but calm.

VISUAL MOOD
Cool, exact, and calm. Deep blueprint dark, thin luminous linework, soft glass panels with 1px borders and 2% white fills. No glow blobs, no 3D clouds, no confetti.

TYPOGRAPHY
A neutral grotesk with tabular figures for data and metrics; 11px uppercase kickers at 0.28em tracking; values and code snippets in a crisp mono at 13px with relaxed line-height.

COLOR
Blueprint dark #0a0c0e base, steel hairlines at 8–14% white, ice #9fd6ff for diagram strokes, and {{accent}} as a single warm signal for the primary CTA and active states only.

MOTION & INTERACTION
Diagrams draw themselves via SVG stroke-dashoffset over 1.2s on first view; stat counters tick exactly once; panels settle 8px upward with a 300ms ease-out. Hovering a diagram node highlights connected edges and dims the rest to 20%. Spec rows expand as 200ms accordions.

RESPONSIVE BEHAVIOR
Below 900px the grid collapses to a single column in document order — headline, diagram, then tables. The side rail becomes a bottom-fixed status strip on mobile and hides under 400px. Tables scroll horizontally inside their panels.

ACCESSIBILITY
All diagram information duplicated as an accessible text summary list. Focus rings visible on every control; accordions are real buttons with aria-expanded. Contrast held at 4.5:1 for body, 3:1 for large text and diagram strokes.

TECHNICAL DIRECTION
React + TypeScript + Tailwind; Framer Motion whileInView for staged reveals; hand-built SVG diagrams with CSS-drawn grids. No chart library needed — draw the few data motifs yourself so they stay on-brand.

ORIGINALITY
Invent the product's terminology, node names, and metrics as original content, and draw every diagram from scratch. Do not reproduce any existing product's UI, copy, diagrams, or code.`,customization:{brand:"Strata",industry:"a cloud infrastructure company",product:"a distributed compute platform",tone:"precise and understated",accent:"#9fd6ff"},source:{label:"strata-systems.example",url:"https://example.com/inspirations/strata-systems",credit:"Fictional credit — Bureau Nord"},createdAt:"2026-01-22",baseSaves:87,thumb:{variant:"grid",palette:["#0a0c0e","#1d2b38","#9fd6ff"],ratio:"wide"},origin:"seed"},kb={id:"tidal-type",title:"Tidal Type",category:"Experimental",tags:["kinetic type","variable fonts","cursor-reactive","brutalist grid"],summary:"Typography treated as water — headlines swell, ripple, and drag behind the cursor like a fluid.",analysis:"A type-first direction where the letterforms are the entire show: variable font axes respond to cursor velocity, headlines wrap around a brutalist grid, and every other element demurs. It is loud but disciplined — the system only ever animates type, weight, and spacing.",dna:{typography:"A single variable grotesk used from 100 to 900 weight; headlines at 12vw that ripple by animating font-variation-settings per glyph; mono microcopy for coordinates and timestamps.",color:"Ink base #070c0e with sea-glass #5fd4d0 highlights behind the glyphs; 90% of the canvas is pure typography on black.",layout:"Brutalist: headlines overflow the grid deliberately, body columns are narrow (38ch), and a fixed frame of hairlines and corner ticks makes the chaos feel authored.",motion:"Weight waves propagate through headlines like ripples (60–80ms per glyph). Cursor movement drags nearby glyphs up to 0.4em off-baseline with springy return.",interaction:'Selecting any text plays a slow weight oscillation. A "calm mode" toggle (also auto-on for reduced motion) freezes all ripples to static editorial type.'},buildPrompt:`Design an original typography-led experimental site for {{brand}} — {{industry}} promoting {{product}} — where the type itself is the interface.

CONCEPT
Letterforms behave like water. Variable-font axes respond to cursor velocity; headlines swell, ripple, and settle. Everything else on the page demurs so the type can perform.

LAYOUT & HIERARCHY
- Brutalist grid with headlines at 12vw that intentionally overflow their columns; body columns capped at 38ch.
- A fixed frame of hairlines and corner ticks with mono coordinate readouts makes the chaos feel authored.
- One section per typographic "study": ripple, drag, stack, collapse — each demonstrated live on real copy.

VISUAL MOOD
Ink-black water at night: high contrast, sea-glass highlights glinting off glyph edges, generous darkness between studies. No imagery at all — type, hairlines, and grain only.

TYPOGRAPHY
A single variable grotesk exercised across its full 100–900 weight range; per-glyph animation via font-variation-settings; 10px mono microcopy for coordinates, timestamps, and axis labels.

COLOR
Ink base #070c0e, bone type, and {{accent}} for glints, active axis labels, and the cursor trail. Everything else is black, white, and discipline.

MOTION & INTERACTION
Weight waves propagate through headlines at 60–80ms per glyph; cursor proximity drags glyphs up to 0.4em off-baseline with a springy return. Selection triggers a slow weight oscillation. All effects run on rAF with transform/opacity/font-axes only — no layout thrash.

RESPONSIVE BEHAVIOR
On touch devices, replace cursor-reactivity with scroll-velocity-driven ripples and tap-to-trigger studies. Headlines step from 12vw to a 2-line lockup under 380px. All studies remain fully readable with effects disabled.

ACCESSIBILITY
A persistent, obvious "Calm mode" toggle freezes every effect; it also switches on automatically for prefers-reduced-motion. Body text stays at 4.5:1; animated headlines are duplicated for screen readers as plain text.

TECHNICAL DIRECTION
React + TypeScript + Tailwind; variable font (e.g. a wght-axis grotesk) with Framer Motion springs or direct rAF interpolation on font-variation-settings; zero canvas required.

ORIGINALITY
Choose or license a typeface properly, write every headline and study description yourself, and invent your own ripple behaviors. Do not imitate any existing site's type animations, brand, copy, or code.`,customization:{brand:"Tidal",industry:"a type foundry showcase",product:"a variable-font release",tone:"assured and playful",accent:"#5fd4d0"},source:{label:"tidal-type.example",url:"https://example.com/inspirations/tidal-type",credit:"Fictional credit — Studio Kessler"},createdAt:"2026-05-19",baseSaves:145,thumb:{variant:"glyph",palette:["#070c0e","#123339","#5fd4d0"],ratio:"portrait"},origin:"seed"},bb={id:"ember-motors",title:"Ember Motors",category:"3D",tags:["product reveal","light choreography","scroll scrub","sound cues"],summary:"A cinematic product reveal where light itself performs the launch — darkness first, machine second.",analysis:"The launch sequence is choreographed like a stage play: total darkness, one ember-colored light drawing the silhouette, then a full reveal scrubbed by scroll. The interface is a thin caption system over a full-bleed stage, which keeps the machine the undisputed protagonist.",dna:{typography:"A wide industrial grotesk in extended uppercase for the marque; technical specs in a condensed mono; a single italic serif line reserved for the tagline.",color:"Charcoal #0c0908 stage, ember #ff5a1f light choreography, warm grey steel mid-tones; the palette is essentially two colors plus black.",layout:"Full-bleed stage with captions in the corners; a horizontal timeline scrubber along the bottom edge marks reveal chapters; specs appear in a slide-out technical panel.",motion:"Scroll scrubs the light rig: exposure, angle, and color temperature interpolate with scroll progress. The final reveal settles with a 600ms ease and a subtle camera push.",interaction:'A "watch the reveal" button auto-plays the sequence with optional sound design; dragging the timeline scrubs frames. Hovering hotspots on the machine opens spec callouts.'},buildPrompt:`Design an original cinematic launch site for {{brand}} — {{industry}} unveiling {{product}} — where light performs the reveal.

CONCEPT
The page is a stage. It opens in total darkness; a single ember-colored light traces the machine's silhouette; scroll scrubs the full reveal — exposure, angle, and color temperature rising until the product stands fully lit.

LAYOUT & HIERARCHY
- A full-bleed stage owns every viewport; UI is a thin caption system pinned to the corners.
- A horizontal timeline scrubber along the bottom edge marks the chapters of the reveal (00 Silence, 01 Spark, 02 Form, 03 Standing).
- Technical detail lives in a slide-out panel — dimensions, materials, performance — set like a spec sheet, not a feature grid.

VISUAL MOOD
Automotive noir: charcoal darkness, hot ember accents, brushed steel mid-tones, faint atmospheric haze. Two colors plus black; every frame should work as a film still.

TYPOGRAPHY
An extended industrial grotesk in uppercase for the marque; condensed mono for technical values; one italic serif line used once, for the tagline. Headline lockups never exceed three words per line.

COLOR
Stage #0c0908, ember {{accent}} for all light choreography and the primary CTA, steel greys for surfaces, bone for captions.

MOTION & INTERACTION
Scroll scrubs the light rig with interpolation on opacity, transform, and a CSS variable for exposure. "Play reveal" auto-runs the sequence in 6 seconds with an optional subtle sound design (muted by default). Hotspots on the machine open spec callouts with a 200ms fade. Hold 60fps — pre-render stages as layered compositions rather than live 3D if needed.

RESPONSIVE BEHAVIOR
On mobile the stage becomes a vertical scrub with haptic-friendly timeline drag; captions stack into a lower third; the spec panel becomes a bottom sheet. The experience degrades to an elegant static poster plus text chapters on low-power devices.

ACCESSIBILITY
The full narrative exists as semantic text — the visuals enhance, never carry, the story. Timeline is a real slider (keyboard arrows scrub). Contrast for captions above 4.5:1. Reduced motion gets an instant, fully lit presentation.

TECHNICAL DIRECTION
React + TypeScript + Tailwind; Framer Motion useScroll for scrubbing; layered PNG-style compositions or CSS-lit silhouettes; Web Audio for optional sound. Three.js only if the product genuinely needs orbiting 3D — otherwise cinematic lighting beats geometry.

ORIGINALITY
Design the machine, the light choreography, and all copy from scratch. Do not reproduce any real vehicle, brand, film, or site — this is a direction, not a copy.`,customization:{brand:"Ember",industry:"an electric performance marque",product:"a first concept machine",tone:"confident and cinematic",accent:"#ff5a1f"},source:{label:"ember-motors.example",url:"https://example.com/inspirations/ember-motors",credit:"Fictional credit — ODE Works"},createdAt:"2026-06-09",baseSaves:126,thumb:{variant:"flow",palette:["#0c0908","#38221a","#ff5a1f"],ratio:"wide"},origin:"seed"},Sb={id:"quiet-form",title:"Quiet Form",category:"Minimal",tags:["whitespace","concrete tones","slow crossfades","archival"],summary:"An architecture studio portfolio built from silence — planes, margins, and a dozen disciplined photographs.",analysis:"Every decision removes rather than adds: a single column of projects, crossfades instead of movement, captions set like museum labels. The sophistication comes from proportion — a 61.8% content column, a strict baseline, and the confidence to leave entire viewports empty.",dna:{typography:"One quiet grotesk in two sizes and two weights, nothing else; project titles at 28px medium, everything else 15px regular with a 1.7 line-height.",color:"Bone-light surfaces #f1ede4 with ink #171613 type inverts the usual dark mode — the one section on dark is the studio manifesto.",layout:"A golden-ratio column (61.8%) holds all content; projects listed as full-width rows that expand in place; an archive index uses a strict four-column text table.",motion:"Crossfades only: 700ms image dissolves, 250ms underline reveals. One subtle exception — a 2% scale settle on image hover.",interaction:"Project rows expand accordion-style, revealing a label-plated image and a two-line description. The cursor disappears over images; the image is the cursor."},buildPrompt:`Design an original portfolio for {{brand}} — {{industry}} presenting {{product}} — built almost entirely from restraint.

CONCEPT
An architecture of silence: planes, margins, and museum-label captions. The site should feel like walking through a quiet building where each project gets a room of its own.

LAYOUT & HIERARCHY
- A golden-ratio column (61.8% of the viewport) holds all content, optically centered left.
- Projects are full-width rows — title, year, location — expanding in place to a single label-plated image and a two-line description. One project visible at a time, never a dense grid.
- A separate archive index presents every project as a four-column text table: year / name / type / status.

VISUAL MOOD
Gallery daylight: bone-light surfaces, soft shadows cast by layout rather than effects, enormous margins. A single manifesto section flips to near-black to mark the studio's voice.

TYPOGRAPHY
One quiet grotesk, two sizes, two weights — nothing else. Titles at 28px medium; body at 15px with 1.7 line-height; captions at 12px with 0.08em tracking. No italics, no all-caps headlines.

COLOR
Bone #f1ede4 surface, ink #171613 type, concrete grey #b5afa2 for rules and secondary text, and {{accent}} used once per page — the active project marker.

RESPONSIVE BEHAVIOR

ACCESSIBILITY

React + TypeScript + Tailwind; Framer Motion for height-animated accordions and crossfades; CSS only for imagery treatment (grain via SVG overlay, shadows via box-shadow). No WebGL, no canvas — the discipline is the design.

orial-style site for {{brand}} — {{industry}} explaining {{product}} — that borrows its authority from financial journalism.

Money as journalism: broadsheet headlines, ruled tables, footnoted figures. The page earns trust through editorial grammar — kickers, decks, bylines — not badges and gradient banners.

- Every story carries a kicker (11px uppercase), a serif headline, a 20px deck line, and a reading-time label.
- Data lives in typeset tables with tabular figures and hairline rules; each figure footnotes its source in 12px.

ry}} archiving {{product}} — staged as a science-fiction catalogue of orbiting objects.

CONCEPT
Each project is a catalogued satellite with a registry number, class, and orbital metadata. Visitors navigate a slow constellation or a bureaucratic index — two synchronized views of the same archive.

LAYOUT & HIERARCHY
- Main view: a dark orbital canvas where project markers drift on elliptical paths; a right-edge panel (360px) opens the selected object's dossier.
- Bottom drawer: the index — a dense, sortable table of registry no. / title / year / class / status.
- Selecting anywhere (canvas, table, keyboard) keeps both views synchronized; the other view highlights the same record.

VISUAL MOOD
Instrument panel of a quiet research vessel: void-dark space, luminous thin strokes, tiny instrument readouts, restrained sci-fi. No lens flares, no starfield clutter — maybe forty dim stars total.

TYPOGRAPHY
A technical mono for registry data and readouts; a neutral grotesk for titles at 22–28px; 10px all-caps labels at 0.3em tracking throughout. Registry numbers set large, like plate engravings, on dossier covers.

COLOR
Void #07080a, ice-white strokes, panel-green instrument accents, and {{accent}} marking the current selection and warnings only.

MOTION & INTERACTION
Satellites drift on 60–120s elliptical periods (pure CSS transforms); selection emits a single expanding ring; dossiers translate in with a 240ms spring and 8px overshoot. Hovering an index row dims unrelated satellites to 15%. Everything keyboard-first: arrows move object-to-object in orbital order, Enter opens the dossier, Esc returns.

RESPONSIVE BEHAVIOR
Under 768px the canvas becomes a vertical "orbital strip" of drifting markers above a full-width index; dossiers become full-screen sheets. Touch targets and marker hit-areas stay at 44px minimum.

ACCESSIBILITY
The index table is the accessible source of truth — the canvas is aria-hidden decoration with a text alternative. Focus is trapped in the open dossier and returned on close. All readouts above 4.5:1.

TECHNICAL DIRECTION
React + TypeScript + Tailwind; orbiting via CSS animations on nested transforms; dossier panels with Framer Motion; SVG for rings and markers. No WebGL — orbital mechanics this slow do not need a render loop.

ORIGINALITY
Invent the archive's registry system, object classes, and all project descriptions as original fiction. Do not reproduce NASA/SpaceX assets, existing sci-fi UI from film or games, or any portfolio's brand and code.`,customization:{brand:"Orbital",industry:"a speculative design practice",product:"ten years of concept work",tone:"deadpan scientific",accent:"#9fd6ff"},source:{label:"orbital-archive.example",url:"https://example.com/inspirations/orbital-archive",credit:"Fictional credit — Archive 9"},createdAt:"2026-03-17",baseSaves:93,thumb:{variant:"orbit",palette:["#07080a","#16211c","#8fb7a8"],ratio:"tall"},origin:"seed"},Nb={id:"field-notes",title:"Field Notes",category:"Editorial",tags:["earthy palette","longform","margin annotations","slow reading"],summary:"An earthy longform journal where essays read like annotated notebooks — margins, footnotes, and all.",analysis:"A reading-first direction: 65-character measures, marginalia, drop caps, and a soil-toned palette that reduces screen glare. The design system is essentially a well-made paperback transported to the browser, with progress indicated by a growing root-line rather than a bar.",dna:{typography:"A bookish serif for body at 19px/1.75; small caps for the opening line; handwritten-style annotations only in the margins, never in flow.",color:"Soil and paper: deep loam #12100c ground, unbleached paper panels, moss #a4c964 for links and the growing progress root.",layout:"Single 34ch measure with a wide right margin (30% viewport) holding sidenotes, figures, and footnote markers; chapter openers own a full quiet viewport.",motion:"Almost none by design: sidenotes fade in as they enter the viewport; the progress root-line grows with scroll. That is the entire motion budget.",interaction:'Footnote markers expand inline; a "margins" toggle hides annotations for a purer read; text size control (3 steps) persists to localStorage.'},buildPrompt:`Design an original longform reading experience for {{brand}} — {{industry}} publishing {{product}} — engineered for deep, comfortable reading.

A well-made paperback, transported to the browser: annotated margins, footnotes, drop caps, and a soil-toned palette that lowers glare. Reading is the entire product.

- A single 34-character measure on the left; a wide margin (roughly 30% of viewport) holds sidenotes, small figures, and footnote markers.
- Chapter openers get one full quiet viewport — chapter number in small caps, title, and a single epigraph line.

Field journal at golden hour: deep loam background, unbleached paper reading panels, pressed-flower restraint. Texture comes from a faint paper grain, never from decoration.

e filter re-deals the grid like cards.'},buildPrompt:`Design an original portfolio for {{brand}} — {{industry}} promoting {{product}} — where the interface itself demonstrates the craft.

A showreel you can touch: headlines scatter and reform, tiles tilt toward the cursor in perspective, and a discipline marquee accelerates with scroll velocity. The studio's motion skill is proven by the UI, not claimed in copy.

- A loose 4-column collage; project tiles deliberately break their gutters and overlap by design (with safe overlaps that never obscure controls).
- Statements at 10vw anchor each section; a compact mono marquee of disciplines runs between sections, its speed coupled to scroll velocity.
- Project detail: a full-height case panel with role, year, and a 3-frame "motion poster" that animates on press-and-hold.

Rehearsal space at night: carbon darkness, hard bone type, one acid signal doing all the conducting. Energetic but never noisy — at any frozen moment the layout must still compose like a poster.

One heavy grotesk remixed per section — outlined, filled, split, stacked; 10vw statements with −0.04em tracking; mono microcopy for roles, years, and indexes.

n original e-commerce experience for {{brand}} — {{industry}} selling {{product}} — staged like a spa at dusk.

CONCEPT
Commerce as calm: products float in diffused halos of warm light, transitions breathe rather than snap, and the purchase path underneath is ruthlessly frictionless. Softness outside, efficiency inside.

LAYOUT & HIERARCHY
- Editorial commerce rhythm: alternating full-bleed "ritual" sections and floating trios of products on darkness.
- A persistent glass cart drawer (400px) slides from the right; add-to-cart never navigates, it flies a small dot into the cart icon and updates a count.
- Product detail is a single calm viewport: name, one-line promise, three ingredient notes, price, and one button.

VISUAL MOOD
A spa at dusk: warm darkness a few degrees above black, halos of diffused blush and sage light, soft shadows, and a faint grain like rice paper. Nothing clinical, nothing glossy-loud.

An elegant serif at light weight for product names (32–44px); a quiet sans for all operational text; prices always in tabular figures. Microcopy stays short and warm — no exclamation marks anywhere.

Breathing rhythm: halos pulse between 0.5 and 0.8 opacity on a 6s cycle; cards settle at 1.02 scale over 800ms on hover. Ingredient hotspots open small glass notes. A routine builder lets visitors stack products onto a shelf (drag to reorder) that rolls up into the cart. Reduced motion replaces breathing with static soft gradients.

of stillness."},buildPrompt:`Design an original scrollytelling piece for {{brand}} — {{industry}} presenting {{product}} — where scroll depth equals ocean depth.

CONCEPT
The scrollbar is a depth gauge. Each viewport is a named ocean layer; as the visitor sinks, light dies, pressure figures rise, particles thicken, and the palette cools from sunlit teal to trench void. One metaphor governs everything.

LAYOUT & HIERARCHY
- A single-column descent of full-viewport chapters, each opened by a wide-tracked layer name ("— 200 M: TWILIGHT").
- Facts pin to alternating edges as the column scrolls past; a fixed depth gauge on the right ticks current meters and layer names.
- The trench chapter is nearly empty: one sentence, one figure, one slow light pulse. Earn the emptiness.

VISUAL MOOD
Submersible documentary: marine-snow particles at three parallax speeds, silhouette shapes crossing occasionally, light attenuating through a scroll-linked overlay. Dark, patient, immense.

TYPOGRAPHY
Uppercase layer names with 0.35em tracking as wayfinding; 17px calm sans for body; luminous mono for depth figures and readings. Never more than 40 words per viewport.

COLOR
A vertical journey from {{accent}} teal at the surface through deep blue-greens to void #04070a — background color interpolates continuously with scroll. Text stays bone throughout, dimming slightly with depth but never below 4.5:1.

MOTION & INTERACTION
Particles drift upward as you scroll down (3 parallax planes, transform-only). Sonar pings: clicking anywhere emits one expanding ring and reveals a hidden fact nearby. Hold spacebar (or a button on touch) to stop and let the particles simply drift — a designed stillness. Reduced motion keeps all content, freezes particles, and uses discrete layer backgrounds.

RESPONSIVE BEHAVIOR
The gauge collapses to a thin top progress hairline on mobile; particle counts halve on small screens and quarter on low-power devices; pinned facts become inline blocks between chapters.

ACCESSIBILITY
Every fact, layer name, and figure exists in semantic HTML regardless of motion state; the piece must read top-to-bottom as a normal article. Depth gauge is aria-hidden with a text summary. All copy ≥ 4.5:1 at every depth.

TECHNICAL DIRECTION
React + TypeScript + Tailwind; Framer Motion useScroll for color/overlay interpolation; particles as absolutely-positioned divs or a single lightweight canvas (no physics engine); optional ambient audio, off by default.

ORIGINALITY
Write all layer facts and copy as original research-flavored fiction, draw silhouettes as simple original SVG shapes, and synthesize any sound yourself. Do not reproduce footage, photography, or code from any documentary or site.`,customization:{brand:"Deep Current",industry:"an ocean-literacy foundation",product:"an interactive descent through ocean layers",tone:"reverent and precise",accent:"#5fd4d0"},source:{label:"deep-current.example",url:"https://example.com/inspirations/deep-current",credit:"Fictional credit — Current Theory"},createdAt:"2026-06-24",baseSaves:119,thumb:{variant:"wave",palette:["#070c0e","#123339","#5fd4d0"],ratio:"tall"},origin:"seed"},Pb={id:"vector-one",title:"Vector One",category:"SaaS",tags:["industrial","schematic UI","mono grids","safety-orange"],summary:"Industrial technology with the confidence of a control room — schematics, stamp plates, and safety orange.",analysis:"Heavy industry translated into interface language: steel-grey grids, stamped metal nameplates, schematic drawings that assemble on scroll, and hazard-orange used with the discipline of actual safety signage. It sells precision by looking manufactured rather than marketed.",dna:{typography:"A squarish industrial grotesk for headings, stenciled and uppercase; a dense mono for part numbers, torque values, and every spec; labels riveted like nameplates.",color:"Gunmetal #0c0c0b and machined greys with safety-orange #ffb03a for hazard-stripe accents, active states, and the one CTA — signage discipline, never decoration.",layout:"A rigid 8-column shop-floor grid with visible construction lines; sections numbered like drawing sheets (SHT-01, SHT-02); a riveted header bar carries revision data.",motion:"Schematics assemble line-by-line on scroll (stroke-dashoffset, 900ms); stamped numbers press in with a 150ms scale; everything else is bolted down.",interaction:"Part hotspots open spec plates; an interactive torque/spec calculator lives in the footer; hovering a drawing sheet tilts it 1.5° like lifting a Mylar sheet."},buildPrompt:`Design an original industrial-technology site for {{brand}} — {{industry}} manufacturing {{product}} — with the confidence of a control room.

CONCEPT
Interface as manufacturing: steel-grey grids, stamped nameplates, schematic drawings that assemble themselves, and hazard-orange applied with the discipline of real safety signage. The site should feel machined, not marketed.

LAYOUT & HIERARCHY
- A rigid 8-column shop-floor grid with visible construction lines and section numbers styled as drawing sheets (SHT-01, SHT-02).
- A riveted header bar carries fictional revision data (REV C · 2026-06) and a running stock-status readout.
- One interactive spec calculator (load, span, finish → suggested part) anchors the page — real logic, real feedback.

VISUAL MOOD
Factory floor at second shift: gunmetal darkness, machined surfaces, stencil markings, a single orange doing exactly what safety paint does — marking the things that matter.

TYPOGRAPHY
A squarish industrial grotesk, uppercase and lightly stenciled, for headings; dense mono for part numbers, tolerances, and specs; labels presented as stamped nameplates with 1px bevel borders.

COLOR
Gunmetal #0c0c0b, machined greys at several steps, bone markings, {{accent}} safety-orange strictly for hazard stripes, the CTA, and active states.

MOTION & INTERACTION
Schematics assemble line-by-line on scroll via stroke-dashoffset (900ms, once); stamped numbers press in with a 150ms scale-settle; drawing sheets tilt 1.5° on hover like lifted Mylar. Part hotspots open spec plates anchored to the drawing. Nothing floats, nothing glows.

RESPONSIVE BEHAVIOR

ACCESSIBILITY
Orange-on-gunmetal is validated for every size it is used at (≥ 3:1 for large, ≥ 4.5:1 for small). All specs available as text tables alongside schematics; the calculator is a real labeled form with keyboard support and inline validation.

TECHNICAL DIRECTION
React + TypeScript + Tailwind; hand-drawn SVG schematics with Framer Motion whileInView assembly; nameplates as bordered CSS components; calculator as plain typed state — no chart or form library needed.

ORIGINALITY
Invent the part numbering system, spec values, and schematic geometry as original engineering fiction. Do not copy any real manufacturer's catalogs, drawings, marks, or code.`,customization:{brand:"Vector One",industry:"an industrial robotics manufacturer",product:"a modular actuator line",tone:"stamped and matter-of-fact",accent:"#ffb03a"},source:{label:"vector-one.example",url:"https://example.com/inspirations/vector-one",credit:"Fictional credit — Foundry & Co"},createdAt:"2026-04-30",baseSaves:66,thumb:{variant:"grid",palette:["#0c0c0b","#262624","#ffb03a"],ratio:"wide"},origin:"seed"},Rb={id:"casa-nera",title:"Casa Nera",category:"Minimal",tags:["interiors","travertine tones","room-to-room","editorial pauses"],summary:"An interiors studio site structured as a house — each project a room you walk through, door by door.",analysis:"Navigation is architectural: projects are rooms, transitions are doorways (a 400ms iris wipe through a growing aperture), and the cursor becomes a faint floor-plan dot. Travertine and coal tones keep it material, while a floor-plan minimap makes the structure legible without a single traditional menu.",dna:{typography:"An elegant transitional serif for room names; wayfinding captions in letterspaced caps (STANZA 02 — CUCINA); body copy minimal, set at 16px with wide leading.",color:"Coal #0d0c0b walls, travertine #c8b89a surfaces, warm shadow mid-tones; brass door hardware as the single metallic accent.",layout:'Full-viewport "rooms" with one hero surface per room; a fixed floor-plan minimap (bottom-left) shows progress and allows direct room jumps.',motion:"Doorway iris wipes between rooms (aperture opens from the cursor position, 400ms); surfaces parallax 3% for depth; furniture-grade objects settle with soft shadows.",interaction:"Hovering hotspots on a room reveals material notes; the minimap pulses the current room; pressing M toggles the full floor plan overlay."},buildPrompt:`Design an original interiors-studio site for {{brand}} — {{industry}} presenting {{product}} — structured as a house you walk through.

CONCEPT
Navigation as architecture: each project is a room, each transition a doorway. An iris wipe opens from your cursor like a door swinging wide; a floor-plan minimap keeps the whole house legible. You don't scroll a feed — you move through spaces.

rt experience for {{brand}} — {{industry}} presenting {{product}} — rendered as a breathing night sky.

CONCEPT
A fictional year of night-sky observations becomes the interface: thousands of stars whose brightness, color temperature, and drift encode real values from a generated dataset. The page behaves like a planetarium show with the restraint of a gallery piece.

LAYOUT & HIERARCHY
- One full-bleed sky owns the canvas; narration types itself, line by line, in the lower third.
- Chapters divide the year (Winter, Spring, Summer, Autumn); a minimal legend and axis ticks whisper from the edges — legible, never loud.
- An "annotated mode" toggle overlays exact values, cluster names, and gridlines for visitors who want the science with the art.

VISUAL MOOD
High-altitude darkness at 3 a.m.: deep night blues, starlight whites, a single warm amber for solar values. Luminance carries the data; chroma stays disciplined.

MOTION & INTERACTION
Stars twinkle on independent 4–9s cycles (never synchronized); constellation lines draw in over 600ms; the sky drifts 30° per chapter. A timeline scrubs the whole year (arrow keys step months); hovering a cluster surfaces its story in the margin. Reduced motion: static sky, instant narration, timeline still functional.

ACCESSIBILITY

ORIGINALITY
Generate your own dataset with a seeded algorithm, write the narration, and design your own encodings. Do not reproduce real catalog data, existing data-art pieces, or anyone's code.`,customization:{brand:"Observatory",industry:"a data-art practice",product:"a year of night-sky observations",tone:"hushed and curious",accent:"#ffc266"},source:{label:"observatory.example",url:"https://example.com/inspirations/observatory",credit:"Fictional credit — The Night Desk"},createdAt:"2026-08-30",baseSaves:131,thumb:{variant:"field",palette:["#07080c","#141a26","#ffc266"],ratio:"tall"},origin:"seed"},Ob={id:"afterlight",title:"Afterlight",category:"Portfolio",tags:["creative portfolio","dusk gradients","case-study depth","quiet confidence"],summary:"A creative portfolio shot entirely at golden hour — long shadows, warm haze, and case studies told slowly.",analysis:"The portfolio holds one exposure across every page: dusk. Warm haze gradients (small, directional — never blobs) sit behind oversized case numerals, and the case-study template itself is the star: a disciplined editorial rhythm of image, aside, and pull-quote that makes modest work feel cinematic.",dna:{typography:"A refined grotesk for titles with a serif italic for pull-quotes; case numerals (01–08) set at 120px as graphic anchors; captions in 12px warm grey.",color:"Dusk neutrals: #0c0b09 base warming to #d9a441 haze near the horizon of each section; text never competes with the glow.",layout:"Case studies follow a fixed editorial template — hero numeral, statement, image, aside, pull-quote, next — predictable like chapters in a well-set book.",motion:"Haze drifts laterally at 20s cycles; sections wipe with a 500ms soft-light fade; numerals slide behind the content column on scroll (8% parallax).",interaction:'A "next case" footer previews the following study with a slow warm fade; hovering list items casts a long synthetic shadow; a theme hour slider (dusk ↔ night) retunes the whole palette.'},buildPrompt:`Design an original creative portfolio for {{brand}} — {{industry}} presenting {{product}} — exposed entirely at golden hour.

RESPONSIVE BEHAVIOR
Numerals scale down and step behind content gracefully; the case template holds its order on a single column; the hour slider docks into a settings sheet on mobile; index rows keep generous 56px touch height.

ACCESSIBILITY
Every text color is validated against both ends of the hour slider — the theme must never drop below 4.5:1. Case studies are real articles with heading hierarchy; the hour slider is a labeled input with keyboard support.

TECHNICAL DIRECTION
React + TypeScript + Tailwind; theme hours as CSS custom properties interpolated in one place; Framer Motion for parallax and fades; haze as layered linear-gradients with blur and blend modes — no images needed.

ORIGINALITY
